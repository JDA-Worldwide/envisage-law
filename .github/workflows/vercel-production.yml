name: Vercel Production Deployment

# Envisage production account — live site
# Team: envisage / Project: envisage-law
# Requires GitHub secrets: VERCEL_TOKEN_PRODUCTION, VERCEL_ORG_ID_PRODUCTION,
# VERCEL_PROJECT_ID_PRODUCTION

on:
  push:
    branches:
      - main

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID_PRODUCTION }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_PRODUCTION }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_PRODUCTION }}

jobs:
  Deploy-Production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Vercel CLI
        run: npm install --global vercel@59.1.3
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production
      - name: Build Project Artifacts
        run: vercel build --prod
      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod
